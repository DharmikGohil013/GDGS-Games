<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="nev.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="sudoku.css">
    <link rel="icon" type="image/x-icon" href="GDGS.png">
    <title>Sudoku - GDGS Edu Games</title>
</head>
<body>
    <header>
        <nav>
            <section>
                <nav class="navmode">
                    <div class="nav-left">
                        <img src="a5.png" class="logomode" alt="Logo">
                        <div class="company-info">
                            <span class="logonamemode">GDGS</span>
                        </div>
                        <marquee class="marqueemode" scrollamount="10">
                            <h3>Edu Games - Train Your Brain!</h3>
                        </marquee>
                    </div>
                    <div class="menumode">
                        <a class="menubottonmode" href="index.html">HOME</a>
                        <a class="menubottonmode" href="about.html">ABOUT</a>
                        <a class="menubottonmode" href="downlord.html">DOWNLOAD</a>
                        <a class="menubottonmode" href="commingsoon.html">COMING</a>
                        <a class="menubottonmode" href="gamingsection.html">GAMES</a>
                    </div>
                </nav>
            </section>
        </nav>
    </header>

    <div class="sudoku-wrapper">
        <!-- Game Header -->
        <div class="game-header">
            <h1><i class="fas fa-brain"></i> Sudoku</h1>
            <p>Fill in the 9x9 grid so that each row, column, and 3x3 box contains digits 1-9</p>
        </div>

        <!-- Game Controls -->
        <div class="game-controls">
            <div class="difficulty-selector">
                <label for="difficulty">Difficulty:</label>
                <select id="difficulty">
                    <option value="easy">Easy</option>
                    <option value="medium" selected>Medium</option>
                    <option value="hard">Hard</option>
                </select>
            </div>
            <div class="game-stats">
                <div class="stat">
                    <i class="fas fa-clock"></i>
                    <span id="timer">00:00</span>
                </div>
                <div class="stat">
                    <i class="fas fa-heart"></i>
                    <span id="mistakes">Mistakes: 0/3</span>
                </div>
            </div>
            <button id="new-game-btn" class="control-btn"><i class="fas fa-redo"></i> New Game</button>
        </div>

        <!-- Sudoku Board -->
        <div class="sudoku-container">
            <div id="sudoku-board" class="sudoku-board"></div>
        </div>

        <!-- Number Pad -->
        <div class="number-pad">
            <button class="num-btn" data-num="1">1</button>
            <button class="num-btn" data-num="2">2</button>
            <button class="num-btn" data-num="3">3</button>
            <button class="num-btn" data-num="4">4</button>
            <button class="num-btn" data-num="5">5</button>
            <button class="num-btn" data-num="6">6</button>
            <button class="num-btn" data-num="7">7</button>
            <button class="num-btn" data-num="8">8</button>
            <button class="num-btn" data-num="9">9</button>
            <button class="num-btn erase-btn" data-num="0"><i class="fas fa-eraser"></i></button>
        </div>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button id="hint-btn" class="action-btn"><i class="fas fa-lightbulb"></i> Hint</button>
            <button id="notes-btn" class="action-btn"><i class="fas fa-pencil-alt"></i> Notes</button>
            <button id="undo-btn" class="action-btn"><i class="fas fa-undo"></i> Undo</button>
        </div>

        <!-- Win Modal -->
        <div id="win-modal" class="modal hidden">
            <div class="modal-content">
                <h2><i class="fas fa-trophy"></i> Congratulations!</h2>
                <p>You solved the puzzle!</p>
                <p id="win-time"></p>
                <p id="win-mistakes"></p>
                <button id="play-again-btn" class="control-btn"><i class="fas fa-redo"></i> Play Again</button>
            </div>
        </div>

        <!-- Game Over Modal -->
        <div id="gameover-modal" class="modal hidden">
            <div class="modal-content gameover">
                <h2><i class="fas fa-times-circle"></i> Game Over</h2>
                <p>You made too many mistakes!</p>
                <button id="retry-btn" class="control-btn"><i class="fas fa-redo"></i> Try Again</button>
            </div>
        </div>
    </div>

    <script src="sudoku.js"></script>
</body>
</html>
