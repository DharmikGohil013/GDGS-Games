  <!-- Apply the saved theme before first paint so there is no flash of the wrong skin -->
  <script>
    (function () {
      try {
        var t = localStorage.getItem('playzy:theme');
        if (t === 'dark' || t === 'light') {
          document.documentElement.setAttribute('data-theme', t);
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'dark' ? '#08090F' : '#F3F5FB');
        }
      } catch (e) {}
    })();
  </script>
